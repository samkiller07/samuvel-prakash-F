<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#090d0b; font-family:'JetBrains Mono', monospace;">
  <defs>
    <linearGradient id="greenPlcCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1e16"/>
      <stop offset="100%" stop-color="#060c09"/>
    </linearGradient>
    <filter id="plcGreenGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Grid -->
  <g stroke="#00ff66" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" /><line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" /><line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" /><line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" /><line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Header HUD Bar -->
  <rect x="25" y="20" width="750" height="36" rx="3" fill="#102218" stroke="#00ff66" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="45" cy="38" r="4" fill="#00ff66" filter="url(#plcGreenGlow)" />
  <text x="60" y="42" fill="#00ff66" font-size="12" font-weight="bold" letter-spacing="1.5">INDUSTRIAL CONTROL SYSTEM // PLC MINI AUTOMATION CELL</text>
  <text x="620" y="42" fill="#90c8a8" font-size="11">CODESYS • LADDER LOGIC</text>

  <!-- Node 1: Physical Automation Cell Layout -->
  <rect x="35" y="75" width="220" height="345" rx="4" fill="url(#greenPlcCard)" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="35" y="75" width="220" height="28" rx="4" fill="#183626" stroke="#00ff66" stroke-opacity="0.2"/>
  <text x="50" y="93" fill="#00ff66" font-size="11" font-weight="bold">01 // AUTOMATION CELL</text>

  <!-- Conveyor & Sensor Graphics -->
  <rect x="50" y="115" width="190" height="95" rx="3" fill="#0a1610" stroke="#00ff66" stroke-opacity="0.3"/>
  <text x="60" y="132" fill="#ffffff" font-size="10" font-weight="bold">CONVEYOR &amp; SENSORS</text>
  <!-- Conveyor Belt Representation -->
  <rect x="60" y="145" width="170" height="25" rx="2" fill="#12281c" stroke="#00ff66" stroke-width="1"/>
  <circle cx="75" cy="157" r="6" fill="#00ff66"/>
  <circle cx="215" cy="157" r="6" fill="#00ff66"/>
  <!-- Moving Workpiece -->
  <rect x="130" y="147" width="28" height="20" fill="#ffaa00" stroke="#ffffff" stroke-width="1"/>
  <text x="60" y="195" fill="#a0d8b8" font-size="9">Motor Latching: <tspan fill="#00ff66" font-weight="bold">RUNNING</tspan></text>

  <!-- Proximity & Limit Sensors -->
  <rect x="50" y="220" width="190" height="85" rx="3" fill="#0a1610" stroke="#00ff66" stroke-opacity="0.2"/>
  <text x="60" y="238" fill="#00c8ff" font-size="10" font-weight="bold">SENSOR TELEMETRY</text>
  <text x="60" y="255" fill="#a0d8b8" font-size="9">• I0.0: Start Pushbutton</text>
  <text x="60" y="270" fill="#a0d8b8" font-size="9">• I0.2: Optical Proximity (Detect)</text>
  <text x="60" y="285" fill="#a0d8b8" font-size="9">• I0.3/I0.4: Actuator HOME/END</text>

  <!-- Safety Interlocks -->
  <rect x="50" y="315" width="190" height="90" rx="3" fill="#0a1610" stroke="#ff4444" stroke-opacity="0.4"/>
  <text x="60" y="335" fill="#ff4444" font-size="10" font-weight="bold">SAFETY INTERLOCKS</text>
  <text x="60" y="353" fill="#a0d8b8" font-size="9">• I0.1: Emergency Stop (NC)</text>
  <text x="60" y="369" fill="#a0d8b8" font-size="9">• Overload Relay: HEALTHY</text>
  <text x="60" y="387" fill="#00ff66" font-size="9">• Fault Alarm: NORMAL</text>

  <!-- Flow Connector 1 -->
  <path d="M 255 240 L 295 240" fill="none" stroke="#00ff66" stroke-width="2" stroke-dasharray="4,4" filter="url(#plcGreenGlow)"/>
  <polygon points="295,235 305,240 295,245" fill="#00ff66"/>

  <!-- Node 2: CODESYS Ladder Logic Execution -->
  <rect x="305" y="75" width="225" height="345" rx="4" fill="url(#greenPlcCard)" stroke="#00ff66" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="305" y="75" width="225" height="28" rx="4" fill="#1a3c2a" stroke="#00ff66" stroke-opacity="0.3"/>
  <text x="320" y="93" fill="#00ff66" font-size="11" font-weight="bold">02 // CODESYS LADDER RUNGS</text>

  <!-- Ladder Logic Diagram Rungs -->
  <g transform="translate(320, 115)">
    <!-- Rung 001: Motor Latch -->
    <rect x="0" y="0" width="195" height="60" rx="3" fill="#08140e" stroke="#00ff66" stroke-opacity="0.3"/>
    <line x1="10" y1="5" x2="10" y2="55" stroke="#00ff66" stroke-width="2"/>
    <line x1="185" y1="5" x2="185" y2="55" stroke="#00ff66" stroke-width="2"/>
    <line x1="10" y1="30" x2="40" y2="30" stroke="#00ff66"/>
    <!-- NO Contact (START) -->
    <line x1="40" y1="20" x2="40" y2="40" stroke="#00ff66"/>
    <line x1="50" y1="20" x2="50" y2="40" stroke="#00ff66"/>
    <line x1="50" y1="30" x2="140" y2="30" stroke="#00ff66"/>
    <!-- Coil (Q0.0 MOTOR) -->
    <circle cx="155" cy="30" r="10" fill="none" stroke="#00ff66" stroke-width="1.5"/>
    <line x1="165" y1="30" x2="185" y2="30" stroke="#00ff66"/>
    <text x="30" y="15" fill="#a0d8b8" font-size="7">START</text>
    <text x="145" y="15" fill="#00ff66" font-size="7">Q0.0</text>

    <!-- Rung 002: Actuator Forward -->
    <rect x="0" y="70" width="195" height="60" rx="3" fill="#08140e" stroke="#00ff66" stroke-opacity="0.3"/>
    <line x1="10" y1="75" x2="10" y2="125" stroke="#00ff66" stroke-width="2"/>
    <line x1="185" y1="75" x2="185" y2="125" stroke="#00ff66" stroke-width="2"/>
    <line x1="10" y1="100" x2="40" y2="100" stroke="#00ff66"/>
    <!-- Sensor NO Contact -->
    <line x1="40" y1="90" x2="40" y2="110" stroke="#00ff66"/>
    <line x1="50" y1="90" x2="50" y2="110" stroke="#00ff66"/>
    <line x1="50" y1="100" x2="140" y2="100" stroke="#00ff66"/>
    <!-- Coil (Q0.1 ACT_FWD) -->
    <circle cx="155" cy="100" r="10" fill="none" stroke="#00c8ff" stroke-width="1.5"/>
    <line x1="165" y1="100" x2="185" y2="100" stroke="#00ff66"/>
    <text x="30" y="85" fill="#a0d8b8" font-size="7">OBJ_DET</text>
    <text x="145" y="85" fill="#00c8ff" font-size="7">Q0.1</text>

    <!-- Rung 003: On-Delay Timer TON -->
    <rect x="0" y="140" width="195" height="75" rx="3" fill="#08140e" stroke="#00ff66" stroke-opacity="0.3"/>
    <text x="10" y="155" fill="#ffaa00" font-size="8" font-weight="bold">IEC TON_TIMER (2.0s DWELL):</text>
    <rect x="15" y="165" width="165" height="40" fill="#0f261a" stroke="#ffaa00" stroke-width="1"/>
    <text x="25" y="180" fill="#ffffff" font-size="8">IN: END_LIMIT</text>
    <text x="25" y="195" fill="#ffffff" font-size="8">PT: T#2000MS</text>
    <text x="115" y="180" fill="#00ff66" font-size="8">Q: TIMER_DN</text>
    <text x="115" y="195" fill="#00c8ff" font-size="8">ET: T#2000MS</text>
  </g>

  <!-- Sequence State Machine -->
  <rect x="320" y="340" width="195" height="65" rx="3" fill="#06100a" stroke="#00ff66" stroke-opacity="0.2"/>
  <text x="330" y="358" fill="#00ff66" font-size="9" font-weight="bold">SEQUENTIAL FLOW:</text>
  <text x="330" y="373" fill="#a0d8b8" font-size="8">START &gt; DETECT &gt; STOP &gt; FWD &gt;</text>
  <text x="330" y="388" fill="#a0d8b8" font-size="8">END &gt; 2s DELAY &gt; RETURN &gt; HOME</text>

  <!-- Flow Connector 2 -->
  <path d="M 530 240 L 570 240" fill="none" stroke="#00ff66" stroke-width="2" stroke-dasharray="4,4" filter="url(#plcGreenGlow)"/>
  <polygon points="570,235 580,240 570,245" fill="#00ff66"/>

  <!-- Node 3: Simulation & Outcome Validation -->
  <rect x="580" y="75" width="190" height="345" rx="4" fill="url(#greenPlcCard)" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="580" y="75" width="190" height="28" rx="4" fill="#183626" stroke="#00ff66" stroke-opacity="0.2"/>
  <text x="595" y="93" fill="#00ff66" font-size="11" font-weight="bold">03 // SOFTPLC SIMULATION</text>

  <!-- Actuator Pneumatic Motion -->
  <rect x="595" y="115" width="160" height="85" rx="3" fill="#08140e" stroke="#00c8ff" stroke-opacity="0.4"/>
  <text x="605" y="135" fill="#00c8ff" font-size="10" font-weight="bold">ACTUATOR CYLINDER</text>
  <text x="605" y="152" fill="#a0d8b8" font-size="9">Pneumatic Stroke: 150mm</text>
  <text x="605" y="167" fill="#a0d8b8" font-size="9">Home Sensor (I0.3): TRUE</text>
  <text x="605" y="182" fill="#00ff66" font-size="9">End Sensor (I0.4): TRUE</text>

  <!-- Fault & Auto-Recovery -->
  <rect x="595" y="210" width="160" height="95" rx="3" fill="#08140e" stroke="#ffaa00" stroke-opacity="0.4"/>
  <text x="605" y="230" fill="#ffaa00" font-size="10" font-weight="bold">CYCLE RECOVERY</text>
  <text x="605" y="248" fill="#a0d8b8" font-size="9">• Auto-Home On Startup</text>
  <text x="605" y="263" fill="#a0d8b8" font-size="9">• E-Stop Trip Safe State</text>
  <text x="605" y="278" fill="#a0d8b8" font-size="9">• Fault Memory Reset</text>
  <text x="605" y="293" fill="#00ff66" font-size="9">• CODESYS SoftPLC: PASS</text>

  <!-- Validation Badge -->
  <rect x="595" y="315" width="160" height="90" rx="3" fill="#08140e" stroke="#00ff66" stroke-width="1"/>
  <text x="675" y="340" fill="#00ff66" font-size="10" text-anchor="middle" font-weight="bold">CODESYS V3.5</text>
  <text x="675" y="360" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">SIMULATION TESTED</text>
  <text x="675" y="378" fill="#a0d8b8" font-size="8" text-anchor="middle">VERIFIED CONTROL SEQUENCE</text>
</svg>
