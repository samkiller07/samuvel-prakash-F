<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#070b09; font-family:'JetBrains Mono', monospace;">
  <defs>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1612"/>
      <stop offset="100%" stop-color="#060a08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Grid Pattern -->
  <rect width="800" height="450" fill="url(#gridGrad)" />
  <g stroke="#00ff66" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Header HUD Bar -->
  <rect x="25" y="20" width="750" height="36" rx="3" fill="#0c1410" stroke="#00ff66" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="45" cy="38" r="4" fill="#00ff66" filter="url(#glow)" />
  <text x="60" y="42" fill="#00ff66" font-size="12" font-weight="bold" letter-spacing="1.5">SYS.TELEMETRY // AI AIR QUALITY AUTOMATION</text>
  <text x="630" y="42" fill="#88a090" font-size="11">MCU: ESP32-WROOM-32</text>

  <!-- Hardware Node 1: Sensor Array -->
  <rect x="40" y="80" width="200" height="330" rx="4" fill="url(#cardGrad)" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="40" y="80" width="200" height="28" rx="4" fill="#122018" stroke="#00ff66" stroke-opacity="0.2"/>
  <text x="55" y="98" fill="#00ff66" font-size="11" font-weight="bold">01 // SENSOR ARRAY</text>

  <!-- MQ135 Gas Sensor Graphic -->
  <circle cx="140" cy="160" r="36" fill="#16281e" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="140" cy="160" r="24" fill="#0e1a14" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="140" y="164" fill="#ffaa00" font-size="10" text-anchor="middle" font-weight="bold">MQ-135</text>
  <text x="140" y="210" fill="#a0c0b0" font-size="10" text-anchor="middle">Air Quality (CO2/NH3/Smoke)</text>
  <text x="140" y="226" fill="#00ff66" font-size="12" text-anchor="middle" font-weight="bold">384 PPM [SAFE]</text>

  <!-- DHT22 Sensor Graphic -->
  <rect x="70" y="250" width="140" height="60" rx="3" fill="#101e17" stroke="#00ffff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="80" y="270" fill="#00ffff" font-size="10" font-weight="bold">DHT-22 DUAL SENSOR</text>
  <text x="80" y="290" fill="#e0f0ea" font-size="11">TEMP: <tspan fill="#ffaa00" font-weight="bold">26.8 °C</tspan></text>
  <text x="80" y="304" fill="#e0f0ea" font-size="11">HUMID: <tspan fill="#00ffff" font-weight="bold">58.4 %</tspan></text>

  <rect x="60" y="330" width="160" height="60" rx="3" fill="#0c1611" stroke="#00ff66" stroke-opacity="0.2"/>
  <text x="70" y="350" fill="#88a090" font-size="10">SAMPLING RATE: 10 Hz</text>
  <text x="70" y="366" fill="#88a090" font-size="10">ADC RES: 12-BIT CALIBRATED</text>
  <text x="70" y="382" fill="#00ff66" font-size="10">I2C / ANALOG INTERFACED</text>

  <!-- Flow Connector 1 -->
  <path d="M 240 245 L 290 245" fill="none" stroke="#00ff66" stroke-width="2" stroke-dasharray="4,4" filter="url(#glow)"/>
  <polygon points="290,240 300,245 290,250" fill="#00ff66"/>

  <!-- Hardware Node 2: Microcontroller & Logic Engine -->
  <rect x="300" y="80" width="210" height="330" rx="4" fill="url(#cardGrad)" stroke="#00ff66" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="300" y="80" width="210" height="28" rx="4" fill="#14261c" stroke="#00ff66" stroke-opacity="0.3"/>
  <text x="315" y="98" fill="#00ff66" font-size="11" font-weight="bold">02 // ESP32 CORE ENGINE</text>

  <!-- Microcontroller Chip Icon -->
  <rect x="345" y="125" width="120" height="85" rx="3" fill="#0b120e" stroke="#00ff66" stroke-width="2"/>
  <rect x="360" y="140" width="90" height="55" fill="#122218" stroke="#00ff66" stroke-opacity="0.3"/>
  <text x="405" y="162" fill="#00ff66" font-size="10" text-anchor="middle" font-weight="bold">ESP32-MCU</text>
  <text x="405" y="176" fill="#88a090" font-size="9" text-anchor="middle">240MHz Dual Core</text>
  <text x="405" y="188" fill="#00ffff" font-size="8" text-anchor="middle">FreeRTOS Tasks</text>

  <!-- Live AQI Formula & Closed-Loop Logic -->
  <rect x="315" y="225" width="180" height="85" rx="3" fill="#09120c" stroke="#00ff66" stroke-opacity="0.2"/>
  <text x="325" y="245" fill="#ffaa00" font-size="10" font-weight="bold">AUTOMATION LOGIC:</text>
  <text x="325" y="262" fill="#d0e0d8" font-size="9">IF (PPM &gt; 450 || TEMP &gt; 32°C)</text>
  <text x="325" y="278" fill="#00ff66" font-size="9">&gt; ACTIVATE VENTILATION</text>
  <text x="325" y="294" fill="#00ffff" font-size="9">&gt; DISPATCH IoT TELEMETRY</text>

  <!-- Live Telemetry Mini-Graph -->
  <rect x="315" y="320" width="180" height="75" rx="3" fill="#050a07" stroke="#00ff66" stroke-opacity="0.3"/>
  <path d="M 325 375 Q 355 340, 385 365 T 445 335 T 485 350" fill="none" stroke="#00ff66" stroke-width="1.5" filter="url(#glow)"/>
  <text x="325" y="335" fill="#88a090" font-size="9">REAL-TIME AQI CURVE</text>
  <text x="440" y="385" fill="#00ff66" font-size="9" font-weight="bold">LOW NOISE</text>

  <!-- Flow Connector 2 -->
  <path d="M 510 245 L 560 245" fill="none" stroke="#00ff66" stroke-width="2" stroke-dasharray="4,4" filter="url(#glow)"/>
  <polygon points="560,240 570,245 560,250" fill="#00ff66"/>

  <!-- Hardware Node 3: Actuation & Cloud IoT Layer -->
  <rect x="570" y="80" width="190" height="330" rx="4" fill="url(#cardGrad)" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="570" y="80" width="190" height="28" rx="4" fill="#122018" stroke="#00ff66" stroke-opacity="0.2"/>
  <text x="585" y="98" fill="#00ff66" font-size="11" font-weight="bold">03 // ACTUATION &amp; IoT</text>

  <!-- Relay Module Graphic -->
  <rect x="590" y="125" width="150" height="65" rx="3" fill="#101e17" stroke="#ff5555" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="615" cy="155" r="10" fill="#ff2222" opacity="0.8" filter="url(#glow)"/>
  <text x="635" y="152" fill="#ffffff" font-size="10" font-weight="bold">RELAY ACTUATOR</text>
  <text x="635" y="168" fill="#00ff66" font-size="9">PURGE FAN: ON</text>

  <!-- WiFi / Cloud Dashboard Graphic -->
  <rect x="590" y="205" width="150" height="95" rx="3" fill="#0d1813" stroke="#00ffff" stroke-opacity="0.4" stroke-width="1"/>
  <text x="600" y="225" fill="#00ffff" font-size="10" font-weight="bold">IoT CLUSTER</text>
  <text x="600" y="245" fill="#d0e0d8" font-size="9">MQTT Protocol: Online</text>
  <text x="600" y="261" fill="#d0e0d8" font-size="9">Cloud Uplink: Active</text>
  <text x="600" y="277" fill="#00ff66" font-size="9">Latency: 28 ms</text>
  <text x="600" y="293" fill="#ffaa00" font-size="9">Award: AutoBot 1st Prize</text>

  <!-- Outcome Badge -->
  <rect x="590" y="320" width="150" height="75" rx="3" fill="#09140e" stroke="#00ff66" stroke-width="1"/>
  <text x="665" y="345" fill="#00ff66" font-size="10" text-anchor="middle" font-weight="bold">AUTOBOT HACKATHON</text>
  <text x="665" y="365" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="bold">FIRST PRIZE 2025</text>
  <text x="665" y="382" fill="#88a090" font-size="8" text-anchor="middle">VERIFIED PROTOTYPE</text>
</svg>
