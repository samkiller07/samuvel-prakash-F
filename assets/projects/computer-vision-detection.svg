<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#09090e; font-family:'JetBrains Mono', monospace;">
  <defs>
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180e24"/>
      <stop offset="100%" stop-color="#0a0610"/>
    </linearGradient>
    <filter id="purpleGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Grid -->
  <g stroke="#aa00ff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" /><line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" /><line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" /><line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" /><line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Header HUD Bar -->
  <rect x="25" y="20" width="750" height="36" rx="3" fill="#140a1e" stroke="#aa00ff" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="45" cy="38" r="4" fill="#00ff66" filter="url(#purpleGlow)" />
  <text x="60" y="42" fill="#aa00ff" font-size="12" font-weight="bold" letter-spacing="1.5">REAL-TIME VISION PIPELINE // HUMAN ACTIVITY &amp; OBJECT DETECTION</text>
  <text x="625" y="42" fill="#ccaadd" font-size="11">YOLO • OPENCV • PYTHON</text>

  <!-- Left: Live Detection Camera Feed Simulation -->
  <rect x="35" y="75" width="460" height="345" rx="4" fill="url(#purpleCard)" stroke="#aa00ff" stroke-opacity="0.5" stroke-width="1"/>
  <rect x="35" y="75" width="460" height="28" rx="4" fill="#241238" stroke="#aa00ff" stroke-opacity="0.2"/>
  <text x="50" y="93" fill="#aa00ff" font-size="11" font-weight="bold">LIVE INFERENCE STREAM // FPS: 32.4 // LATENCY: 30.8ms</text>
  <circle cx="475" cy="89" r="4" fill="#ff0044" filter="url(#purpleGlow)" />

  <!-- Camera HUD Reticle & Bounding Boxes Inside Screen -->
  <g transform="translate(55, 115)">
    <!-- Video Frame Background -->
    <rect x="0" y="0" width="420" height="285" fill="#050308" stroke="#aa00ff" stroke-opacity="0.3"/>
    
    <!-- Crosshairs -->
    <line x1="210" y1="130" x2="210" y2="155" stroke="#00ff66" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="195" y1="142" x2="225" y2="142" stroke="#00ff66" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Bounding Box 1: Person (Posture: Sitting) -->
    <rect x="40" y="25" width="160" height="235" fill="none" stroke="#00ff66" stroke-width="2" filter="url(#purpleGlow)"/>
    <rect x="40" y="25" width="160" height="20" fill="#00ff66"/>
    <text x="45" y="39" fill="#000000" font-size="10" font-weight="bold">PERSON: 0.94 [SITTING]</text>
    
    <!-- Pose Skeleton lines on Person -->
    <circle cx="120" cy="70" r="14" fill="none" stroke="#00ffff" stroke-width="2"/> <!-- Head -->
    <line x1="120" y1="84" x2="120" y2="160" stroke="#00ffff" stroke-width="2"/> <!-- Spine -->
    <line x1="120" y1="105" x2="80" y2="145" stroke="#00ffff" stroke-width="2"/> <!-- Arm Left -->
    <line x1="120" y1="105" x2="160" y2="145" stroke="#00ffff" stroke-width="2"/> <!-- Arm Right -->
    <line x1="120" y1="160" x2="70" y2="210" stroke="#00ffff" stroke-width="2"/> <!-- Leg Left -->
    <line x1="120" y1="160" x2="170" y2="210" stroke="#00ffff" stroke-width="2"/> <!-- Leg Right -->
    <circle cx="120" cy="105" r="3" fill="#ffaa00"/>
    <circle cx="80" cy="145" r="3" fill="#ffaa00"/>
    <circle cx="160" cy="145" r="3" fill="#ffaa00"/>
    <circle cx="120" cy="160" r="3" fill="#ffaa00"/>

    <!-- Bounding Box 2: Laptop -->
    <rect x="130" y="150" width="110" height="90" fill="none" stroke="#00c8ff" stroke-width="1.5"/>
    <rect x="130" y="150" width="110" height="16" fill="#00c8ff"/>
    <text x="135" y="162" fill="#000000" font-size="9" font-weight="bold">LAPTOP: 0.91</text>

    <!-- Bounding Box 3: Chair -->
    <rect x="25" y="120" width="190" height="145" fill="none" stroke="#ffaa00" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="25" y="120" width="90" height="14" fill="#ffaa00"/>
    <text x="30" y="131" fill="#000000" font-size="8" font-weight="bold">CHAIR: 0.88</text>

    <!-- Bounding Box 4: Cell Phone -->
    <rect x="280" y="180" width="60" height="80" fill="none" stroke="#ff00bb" stroke-width="1.5"/>
    <rect x="280" y="180" width="60" height="16" fill="#ff00bb"/>
    <text x="284" y="192" fill="#ffffff" font-size="8" font-weight="bold">CELL: 0.86</text>
  </g>

  <!-- Right: Pipeline Architecture & Analysis Specs -->
  <rect x="510" y="75" width="260" height="345" rx="4" fill="url(#purpleCard)" stroke="#aa00ff" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="510" y="75" width="260" height="28" rx="4" fill="#241238" stroke="#aa00ff" stroke-opacity="0.2"/>
  <text x="525" y="93" fill="#aa00ff" font-size="11" font-weight="bold">ARCHITECTURE &amp; POSTURE</text>

  <!-- Pipeline Step 1 -->
  <rect x="525" y="115" width="230" height="65" rx="3" fill="#0e0618" stroke="#aa00ff" stroke-opacity="0.2"/>
  <text x="535" y="132" fill="#00ffff" font-size="10" font-weight="bold">1. OPENCV FRAME CAPTURE</text>
  <text x="535" y="148" fill="#d0b8e8" font-size="9">• 1080p Stream Preprocessing</text>
  <text x="535" y="163" fill="#d0b8e8" font-size="9">• Resolution Scaling &amp; Normalization</text>

  <!-- Pipeline Step 2 -->
  <rect x="525" y="190" width="230" height="75" rx="3" fill="#0e0618" stroke="#aa00ff" stroke-opacity="0.2"/>
  <text x="535" y="207" fill="#00ff66" font-size="10" font-weight="bold">2. YOLO INFERENCE ENGINE</text>
  <text x="535" y="223" fill="#d0b8e8" font-size="9">• Backbone Feature Extraction</text>
  <text x="535" y="238" fill="#d0b8e8" font-size="9">• Anchor-Free Bounding Predictions</text>
  <text x="535" y="253" fill="#00ff66" font-size="9">• NMS Suppression (IoU: 0.45)</text>

  <!-- Pipeline Step 3 -->
  <rect x="525" y="275" width="230" height="70" rx="3" fill="#0e0618" stroke="#aa00ff" stroke-opacity="0.2"/>
  <text x="535" y="292" fill="#ffaa00" font-size="10" font-weight="bold">3. POSTURE CLASSIFICATION</text>
  <text x="535" y="308" fill="#d0b8e8" font-size="9">• Keypoint Angle Trigonometry</text>
  <text x="535" y="323" fill="#d0b8e8" font-size="9">• States: Standing / Sitting / Moving</text>
  <text x="535" y="338" fill="#00ffff" font-size="9">• Temporal Frame Smoothing</text>

  <!-- Performance Summary -->
  <rect x="525" y="355" width="230" height="50" rx="3" fill="#140a22" stroke="#00ff66" stroke-width="1"/>
  <text x="640" y="375" fill="#00ff66" font-size="10" text-anchor="middle" font-weight="bold">LOW-LATENCY EDGE VISION</text>
  <text x="640" y="392" fill="#ffffff" font-size="9" text-anchor="middle">GPU / CPU OPTIMIZED PIPELINE</text>
</svg>
