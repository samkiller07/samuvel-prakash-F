<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#080b0e; font-family:'JetBrains Mono', monospace;">
  <defs>
    <linearGradient id="cyanCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a24"/>
      <stop offset="100%" stop-color="#060e14"/>
    </linearGradient>
    <filter id="thermalGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Grid -->
  <g stroke="#00ffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" /><line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" /><line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" /><line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" /><line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Header HUD Bar -->
  <rect x="25" y="20" width="750" height="36" rx="3" fill="#0e1b24" stroke="#00ffff" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="45" cy="38" r="4" fill="#ff7700" filter="url(#thermalGlow)" />
  <text x="60" y="42" fill="#00ffff" font-size="12" font-weight="bold" letter-spacing="1.5">THERMAL FEEDBACK CONTROL // IoT SMART INCUBATOR SYSTEM</text>
  <text x="635" y="42" fill="#90c0d8" font-size="11">ESP8266 • PID CONTROL</text>

  <!-- Node 1: Chamber Environmental Sensing -->
  <rect x="35" y="75" width="220" height="345" rx="4" fill="url(#cyanCard)" stroke="#00ffff" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="35" y="75" width="220" height="28" rx="4" fill="#142838" stroke="#00ffff" stroke-opacity="0.2"/>
  <text x="50" y="93" fill="#00ffff" font-size="11" font-weight="bold">01 // CHAMBER SENSORS</text>

  <!-- DHT11 Sensor Chamber Interface -->
  <rect x="50" y="115" width="190" height="120" rx="3" fill="#08141e" stroke="#00ffff" stroke-opacity="0.3"/>
  <text x="60" y="135" fill="#ffffff" font-size="10" font-weight="bold">INCUBATOR CHAMBER</text>
  
  <!-- Target vs Current Temp Display -->
  <rect x="60" y="145" width="170" height="38" rx="2" fill="#0a1c2a" stroke="#ff7700" stroke-width="1"/>
  <text x="70" y="160" fill="#a0c8e0" font-size="9">TARGET TEMP: <tspan fill="#00ff66" font-weight="bold">37.5 °C</tspan></text>
  <text x="70" y="174" fill="#a0c8e0" font-size="9">CURRENT TEMP: <tspan fill="#ff7700" font-weight="bold">37.4 °C (±0.1)</tspan></text>

  <rect x="60" y="190" width="170" height="35" rx="2" fill="#0a1c2a" stroke="#00ffff" stroke-opacity="0.5"/>
  <text x="70" y="205" fill="#a0c8e0" font-size="9">HUMIDITY SET: 65.0 %</text>
  <text x="70" y="218" fill="#a0c8e0" font-size="9">MEASURED HUMID: <tspan fill="#00ffff" font-weight="bold">64.8 %</tspan></text>

  <!-- Physical Chamber Specs -->
  <rect x="50" y="245" width="190" height="160" rx="3" fill="#08141e" stroke="#00ffff" stroke-opacity="0.2"/>
  <text x="60" y="265" fill="#00ff66" font-size="10" font-weight="bold">SYSTEM TOLERANCES</text>
  <text x="60" y="285" fill="#90b8d0" font-size="9">• Thermal Gradient: &lt; 0.2°C</text>
  <text x="60" y="302" fill="#90b8d0" font-size="9">• Airflow Circulation: Constant</text>
  <text x="60" y="319" fill="#90b8d0" font-size="9">• Sensor Sample Interval: 1.0s</text>
  <text x="60" y="336" fill="#90b8d0" font-size="9">• Calibration Offset: Stored EEPROM</text>
  <text x="60" y="365" fill="#00ff66" font-size="9" font-weight="bold">CLOSED-LOOP STABILITY: 99.8%</text>

  <!-- Flow Connector 1 -->
  <path d="M 255 240 L 295 240" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="4,4" filter="url(#thermalGlow)"/>
  <polygon points="295,235 305,240 295,245" fill="#00ffff"/>

  <!-- Node 2: Microcontroller & PID Closed Loop -->
  <rect x="305" y="75" width="225" height="345" rx="4" fill="url(#cyanCard)" stroke="#00ffff" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="305" y="75" width="225" height="28" rx="4" fill="#183044" stroke="#00ffff" stroke-opacity="0.3"/>
  <text x="320" y="93" fill="#00ffff" font-size="11" font-weight="bold">02 // ESP8266 PID LOGIC</text>

  <!-- PID Equations & Loop Visual -->
  <rect x="320" y="115" width="195" height="130" rx="3" fill="#06121c" stroke="#00ffff" stroke-opacity="0.3"/>
  <text x="330" y="135" fill="#ff7700" font-size="10" font-weight="bold">PID THERMAL FORMULA:</text>
  <text x="330" y="155" fill="#ffffff" font-size="9">u(t) = Kp·e(t) + Ki∫e(t)dt</text>
  <text x="330" y="170" fill="#ffffff" font-size="9">      + Kd·(de(t)/dt)</text>
  <text x="330" y="195" fill="#00ff66" font-size="9">Kp = 4.2  (Proportional)</text>
  <text x="330" y="210" fill="#00c8ff" font-size="9">Ki = 0.15 (Integral - AntiWindup)</text>
  <text x="330" y="225" fill="#ffaa00" font-size="9">Kd = 1.05 (Derivative Damper)</text>

  <!-- PID Output Graph -->
  <g transform="translate(320, 255)">
    <rect x="0" y="0" width="195" height="150" rx="3" fill="#040c12" stroke="#00ffff" stroke-opacity="0.3"/>
    <text x="10" y="20" fill="#00ffff" font-size="9" font-weight="bold">THERMAL STEP RESPONSE</text>
    <!-- Axis lines -->
    <line x1="20" y1="125" x2="180" y2="125" stroke="#446677" stroke-width="1"/>
    <line x1="20" y1="35" x2="20" y2="125" stroke="#446677" stroke-width="1"/>
    <!-- Setpoint line -->
    <line x1="20" y1="65" x2="180" y2="65" stroke="#00ff66" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="130" y="60" fill="#00ff66" font-size="8">SP: 37.5°C</text>
    <!-- Temperature rise curve -->
    <path d="M 20 120 Q 55 55, 95 62 T 180 65" fill="none" stroke="#ff7700" stroke-width="2" filter="url(#thermalGlow)"/>
    <text x="25" y="140" fill="#90b8d0" font-size="8">0s        30s       60s       90s</text>
  </g>

  <!-- Flow Connector 2 -->
  <path d="M 530 240 L 570 240" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="4,4" filter="url(#thermalGlow)"/>
  <polygon points="570,235 580,240 570,245" fill="#00ffff"/>

  <!-- Node 3: Actuator & Web Dashboard -->
  <rect x="580" y="75" width="190" height="345" rx="4" fill="url(#cyanCard)" stroke="#00ffff" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="580" y="75" width="190" height="28" rx="4" fill="#142838" stroke="#00ffff" stroke-opacity="0.2"/>
  <text x="595" y="93" fill="#00ffff" font-size="11" font-weight="bold">03 // ACTUATION &amp; WEB</text>

  <!-- Relay & Heater Stage -->
  <rect x="595" y="115" width="160" height="85" rx="3" fill="#08141e" stroke="#ff7700" stroke-opacity="0.5"/>
  <text x="605" y="135" fill="#ff7700" font-size="10" font-weight="bold">HEATER &amp; FAN RELAY</text>
  <text x="605" y="152" fill="#d0e2ec" font-size="9">Solid-State Relay: ACTIVE</text>
  <text x="605" y="167" fill="#d0e2ec" font-size="9">PWM Duty Cycle: 42%</text>
  <text x="605" y="182" fill="#00ff66" font-size="9">Chamber Fan: Continuous</text>

  <!-- IoT Web Server -->
  <rect x="595" y="210" width="160" height="95" rx="3" fill="#08141e" stroke="#00ffff" stroke-opacity="0.3"/>
  <text x="605" y="230" fill="#00ffff" font-size="10" font-weight="bold">ESP8266 WEB SERVER</text>
  <text x="605" y="248" fill="#d0e2ec" font-size="9">• WebSockets Live Stream</text>
  <text x="605" y="263" fill="#d0e2ec" font-size="9">• Remote SP Calibration</text>
  <text x="605" y="278" fill="#d0e2ec" font-size="9">• Historical Temp Logs</text>
  <text x="605" y="293" fill="#00ff66" font-size="9">• Auto-Alarm Triggers</text>

  <!-- Prototype Validation Badge -->
  <rect x="595" y="315" width="160" height="90" rx="3" fill="#08141e" stroke="#00ff66" stroke-width="1"/>
  <text x="675" y="340" fill="#00ff66" font-size="10" text-anchor="middle" font-weight="bold">HARDWARE TESTED</text>
  <text x="675" y="360" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">PID CLOSED-LOOP</text>
  <text x="675" y="378" fill="#90b8d0" font-size="8" text-anchor="middle">WORKING HARDWARE PROTOTYPE</text>
</svg>
